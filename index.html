<title>Презентации QAJ Service</title>
<style>
:root{--navy:#0B1A2E;--or:#F59A23;--mute:#B6C4D6;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(900px 600px at 20% 10%,rgba(77,179,255,.16),transparent 60%),radial-gradient(800px 600px at 90% 100%,rgba(245,154,35,.14),transparent 60%),var(--navy);color:#F2F5F8;font:16px/1.5 Onest,'Segoe UI',system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px}
form{width:100%;max-width:420px;padding:34px 30px;border-radius:24px;background:rgba(255,255,255,.05);border:1px solid var(--line);backdrop-filter:blur(10px)}
.lk{width:58px;height:58px;border-radius:16px;background:var(--or);display:grid;place-items:center;margin-bottom:18px}
.lk svg{width:28px;height:28px;stroke:#0B1A2E;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
small{display:block;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);font-weight:700}
h1{font-size:24px;line-height:1.25;margin:8px 0 6px}
p{margin:0 0 22px;color:var(--mute);font-size:15px}
input[type=password]{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font:600 18px/1 inherit;padding:0 16px;outline:none}
input[type=password]:focus{border-color:var(--or)}
label{display:flex;gap:10px;align-items:center;margin:14px 0 20px;color:var(--mute);font-size:14px;cursor:pointer}
label input{width:18px;height:18px;accent-color:var(--or)}
button{width:100%;height:52px;border:0;border-radius:999px;background:var(--or);color:#0B1A2E;font:700 17px/1 inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:#FF8A7E;font-size:14px;min-height:20px;margin-top:12px}
form.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
